name: Publish loading screen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify website assets
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html style.css script.js _site/
          cp assets/icon.svg _site/assets/
          for n in 01 02 03 04 05 06 07; do
            test -s "assets/scene-${n}.webp"
            cp "assets/scene-${n}.webp" _site/assets/
          done
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
